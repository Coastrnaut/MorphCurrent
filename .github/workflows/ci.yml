name: Native Windows offline Python tests
on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install native Windows controller dependencies
        run: python -m pip install -e ".[dev]"
      - name: Offline pytest (no GPU or local ComfyUI)
        run: python -m pytest -m "not integration and not gpu"
      - name: Validate storyboard
        run: python -m morph_studio.cli validate configs/sequences/organic-machines.yaml
      - name: Compile storyboard plan
        run: python -m morph_studio.cli plan configs/sequences/organic-machines.yaml
      - name: Windows host diagnostics without contacting ComfyUI
        run: python -m morph_studio.cli doctor --skip-comfy
