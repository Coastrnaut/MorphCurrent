name: Offline Python tests
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run offline tests only
        run: python -m pytest -m "not integration and not gpu"
      - name: Validate storyboard
        run: python -m morph_studio.cli validate configs/sequences/organic-machines.yaml
      - name: Compile storyboard plan
        run: python -m morph_studio.cli plan configs/sequences/organic-machines.yaml
