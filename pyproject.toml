[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "morphcurrent"
version = "0.1.0"
description = "Local-first continuous AI video morphing orchestration foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "httpx>=0.27,<1",
  "websockets>=13,<17",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
morphcurrent = "morph_studio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: requires running local ComfyUI", "gpu: performs model inference on local GPU"]
