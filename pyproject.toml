[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morphcurrent"
version = "0.1.0"
description = "Turn a YAML storyboard into a continuous morph video with local ComfyUI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "httpx>=0.27,<1",
  "websockets>=13,<17",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
morphcurrent = "morph_studio.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: requires a running local ComfyUI",
  "gpu: performs model inference on the local GPU",
]
