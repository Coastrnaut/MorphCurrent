# Claude-drafted fixes for film anchors that fail the pass standard (configs/film/anchor-standard.yaml).
# Owner instruction 2026-11-24: Claude judges every anchor and iterates fixes until all pass.
# apply: fresh (independent text-to-image keyframe) | instruction (re-edit from the parent) | prompt (revised prompt)
# Optional: prompt (revised prompt), style (per-anchor style-pack overrides, merged into style_override).
# `film-storyboard` applies these; `render --anchors-only` re-renders changed anchors and their edit descendants.
version: 1
natural_scene: &natural
  description: >-
    Cinematic photograph of a natural electrical phenomenon in its real setting, photorealistic, crisp detail,
    no man-made objects, no pedestal, no stand, no frame, no studio props
  composition: phenomenon centered and filling the frame, wide view, nothing cropped
  negative: [text, letters, labels, logo, watermark, brand names, people, hands, cluttered background, cropped subject,
             pedestal, plinth, stand, display case, frame, anvil, man-made objects, aquarium, glass tank, pottery,
             vase, container, box]
fixes:
  # --- iteration 0 (Spark batch-1 contact sheet): reference edits that kept the parent ------------------
  # --- iteration 1 (anchors-only pass 1, 18 anchors judged; 9 fail) ---------------------------------------
  - anchor: storm-cell-over-plain
    apply: prompt
    iteration: 1
    problem: the cloud sits on a copper and glass pedestal like a museum piece (plausibility, single subject)
    prompt: >-
      a towering flat-topped cumulonimbus thunderstorm cloud spreading out high above an empty dark grassy plain
      at night, lit from within by flickering lightning, grey rain curtains falling onto the bare ground; nothing
      on the ground; dominant shapes: mushroom-shaped cloud top, column; materials: water vapour, ice
    style: *natural
  - anchor: forked-lightning-bolt
    apply: fresh
    iteration: 1
    problem: a copper fork-shaped object on a ceramic stand sits in front of the lightning (single subject)
    prompt: >-
      a single bright forked lightning bolt splitting into many thin branching channels from the clouds down to
      the bare open ground of an empty plain against a black night sky, nothing at the strike point; dominant shapes: branching line, fork; materials:
      plasma, air
    style: *natural
  - anchor: rubbed-amber-and-fur
    apply: fresh
    iteration: 2
    problem: (it 0) parent spheres remained; (it 2) the fresh render put copper spheres on both ends (subject)
    prompt: >-
      a single honey-coloured polished amber rod held diagonally, a small tuft of brown fur touching its middle,
      tiny fibres and dust specks jumping up toward the rod; nothing attached to the ends of the rod, no spheres,
      no metal; dominant shapes: rod, fibres; materials: amber, fur
  - anchor: mast-tip-corona
    apply: fresh
    iteration: 1
    problem: glass tubes and fittings left over from the amber rod clutter the mast (carryover)
    prompt: >-
      the top of a tall wooden ship's mast at night in a storm, its pointed tip crowned by a pale blue-violet
      corona glow with fine discharge streamers; dominant shapes: spike, halo; materials: wood, ionized air
    style:  # iteration 1 natural style kept verbatim: passed in iteration 2 (a mast is man-made)
      description: >-
        Cinematic photograph of a natural electrical phenomenon in its real setting, photorealistic, crisp detail,
        no man-made objects, no pedestal, no stand, no frame, no studio props
      composition: phenomenon centered and filling the frame, wide view, nothing cropped
  - anchor: aurora-curtain
    apply: fresh
    iteration: 1
    problem: the aurora is shown inside a copper frame with a copper cup in the snow (single subject)
    prompt: >-
      rippling green and violet aurora curtains folding across a polar night sky above an empty untouched snowy
      plain, wide landscape view, nothing standing on the snow; dominant shapes: curtain, ribbon; materials: ionized gas
    style: *natural
  - anchor: electric-eel-silhouette
    apply: fresh
    iteration: 1
    problem: the eel is inside a glowing copper frame left over from the aurora (carryover)
    prompt: >-
      a long dark eel-like electric fish swimming through dark murky water, faint stacked electrocyte bands
      glowing softly along its whole body, side view; dominant shapes: elongated body, stacked bands;
      materials: water, living tissue
    style:
      description: >-
        Cinematic underwater photograph of a living animal in dark water, photorealistic, crisp detail,
        no man-made objects, no frame, no aquarium glass
      composition: whole animal in frame, centered, side view, nothing cropped
      negative: [text, letters, labels, logo, watermark, people, hands, cropped subject, aquarium, glass tank,
                 tank edge, pottery, pot, vase, frame, man-made objects]
  - anchor: charged-dust-cloud
    apply: fresh
    iteration: 1
    problem: the dust streams out of a copper and glass nozzle (single subject)
    prompt: >-
      glittering dust motes drifting and clustering along gently curved invisible field lines inside a single
      diagonal sunbeam crossing an empty dark room, no lightning, no sparks, no furniture; dominant shapes: points, field lines; materials: dust, light
    style: *natural
  - anchor: crown-of-cups
    apply: fresh
    iteration: 1
    problem: a single cup under a wire cage, not a ring of cups bridged by metal strips (subject)
    prompt: >-
      crown of cups battery: a ring of eight small glass cups filled with brine standing in a circle, each cup
      bridged to the next by an arched strip of zinc joined to copper; dominant shapes: ring, arches;
      materials: glass, zinc, copper, brine
  - anchor: rolled-paper-capacitor
    apply: fresh
    iteration: 1
    problem: shows the accumulator's glass box with rolls inside instead of one rolled capacitor (carryover, subject)
    prompt: >-
      a single rolled foil and paper capacitor: two long strips of metal foil and waxed paper rolled tightly
      into a cylinder, partly unrolled to show the spiral layers, two thin wire leads at the ends; dominant
      shapes: spiral, cylinder; materials: aluminium foil, waxed paper
  - anchor: glass-plate-condenser-stack
    apply: fresh
    iteration: 1
    problem: repeats the glass box with rolls instead of a stack of glass plates with foil (carryover, subject)
    prompt: >-
      a block of square glass plates interleaved with thin foil sheets, stacked and clamped in a simple wooden
      frame with brass screws; dominant shapes: stacked plates, block; materials: glass, foil, wood
  # --- iteration 1b (anchors #19-#39 judged): systemic + specific ----------------------------------------
  # Systemic: Power (#20-#28) and Signal (#30-#38) edit chains kept the parent object for 8-10 anchors in a
  # row (stator ring with water for the transformers and tower; telegraph key for sounder, register, cable,
  # telephone). Fix: acts.yaml `edit_prompts: instruction` (every reference edit becomes a replace instruction).
  # Pass in this group: friction-machine-globe, water-turbine-runner, telegraph-pole-line, glowing-vacuum-tube.
  - anchor: crystal-radio-set
    apply: prompt
    iteration: 1
    problem: modern padded headphones (anachronism); otherwise coil and crystal read (plausibility)
    prompt: >-
      Replace the previous object completely with a 1920s crystal radio set: a small wooden board holding a coil
      of enamelled wire wound on a cardboard tube, a galena crystal in a brass cup touched by a fine cat's-whisker
      wire probe, and a pair of early headphones with round black bakelite earpieces on a thin steel headband.
      Keep only the lighting, colour grade, camera angle and dark background. Dominant shapes: coil, board;
      materials: wood, copper wire, galena
  # --- iteration 2 (new pass with replace-instruction edits; #1-#19 judged) -------------------------------
  # Pass: fulgurite-glass-tube, spark-between-spheres, mast-tip-corona, glass-leyden-jar, voltaic-pile-column,
  # crown-of-cups, carbon-zinc-dry-cell, lead-acid-accumulator, rolled-paper-capacitor, glass-plate-condenser-stack
  # (porous-pot-wet-cell unchanged, passed in iteration 1).
  # Fail: storm (literal anvil on a glass block), lightning (glass/copper stand at the strike), aurora (copper
  # cylinder on the snow), eel (aquarium glass and a pot), dust (pots and a stray lightning streak) -> natural
  # negative list + wording; amber (spheres on the rod ends) -> prompt; battery and friction machine below.
  - anchor: battery-of-jars
    apply: fresh
    iteration: 2
    problem: jars hidden inside a wooden box wall behind many rods; not readable at thumbnail size (single subject)
    prompt: >-
      a battery of four large foil-coated Leyden jars standing in a row in a shallow open wooden tray, their brass
      rods joined along the top by one brass bar, every jar fully visible from the front; dominant shapes: row of
      cylinders, bar; materials: glass, tin foil, brass, wood
  - anchor: friction-machine-globe
    apply: fresh
    iteration: 2
    problem: the copper plates and brass screws of the condenser stack remain as its base (carryover)
    prompt: >-
      hand-cranked friction generator: a large glass globe on a horizontal axle turned by a brass crank, a
      leather pad rubbing the globe and a metal comb collecting charge, all on a plain dark wooden base;
      dominant shapes: sphere, axle, crank; materials: glass, leather, brass
  # --- iteration 2b (#20-#43 judged; replace instructions removed the carryover) ---------------------------
  # Pass: brass-telegraph-key, armoured-undersea-cable, manual-switchboard, glowing-vacuum-tube,
  # tube-amplifier-chassis, tube-flip-flop-panel, mercury-delay-line; Power steam-engine-flywheel and
  # belt-driven-dynamo read well but re-render (the friction machine root changes) and are judged again.
  # Power notes for the next pass: disc dynamo and transformer core cropped; coil generator kept a copper slab.
  - anchor: water-turbine-runner
    apply: prompt
    iteration: 2
    problem: two identical runners side by side (duplicate copy)
    prompt: >-
      Replace the previous object completely with one single bronze water turbine runner: a ring of curved
      buckets around a hub, water spraying across it inside a round concrete pit; exactly one runner, whole and
      centered. Keep only the lighting, colour grade, camera angle and dark background. Dominant shapes: radial
      blades, ring; materials: bronze, water, concrete
  - anchor: generator-stator-hall
    apply: prompt
    iteration: 2
    problem: a cog-like wheel standing in the turbine's water basin; no stator, no hall (subject, carryover)
    prompt: >-
      Replace the previous object and the water basin completely with a giant generator stator: a huge circular
      steel stator ring lined with hundreds of copper bars, standing in a vast dim turbine hall with an overhead
      crane girder, seen whole from the front. Keep only the lighting and colour grade. Dominant shapes: ring,
      radial bars; materials: copper, steel
  - anchor: telegraph-sounder
    apply: prompt
    iteration: 2
    problem: two coils only; the brass armature lever and its stop are missing (subject)
    prompt: >-
      Replace the previous object completely with a telegraph sounder on a small wooden base: a pair of upright
      copper-wound electromagnet coils with a horizontal brass armature lever pivoted above them, the lever's
      free end resting against an adjustable brass stop. Keep only the lighting, colour grade, camera angle and
      dark background. Dominant shapes: paired coils, bar; materials: copper wire, brass, iron
  - anchor: paper-tape-register
    apply: prompt
    iteration: 2
    problem: two reels with glowing tape; no clockwork or embossing stylus (subject)
    prompt: >-
      Replace the previous object completely with a paper-tape telegraph register: a brass clockwork mechanism
      with visible gears pulling a narrow white paper strip from a reel under a small embossing stylus driven by
      an electromagnet coil. Keep only the lighting, colour grade, camera angle and dark background. Dominant
      shapes: strip, gears; materials: paper, brass
  - anchor: candlestick-telephone
    apply: prompt
    iteration: 2
    problem: a later handset phone with a coiled cord, not an upright candlestick telephone (plausibility)
    prompt: >-
      Replace the previous object completely with an early upright candlestick desk telephone: a tall slim black
      column on a round base with a cone-shaped mouthpiece on top and a separate cone earpiece hanging on a hook
      on the side, a straight cloth-covered cord; no handset, no coiled cord. Keep only the lighting, colour
      grade, camera angle and dark background. Dominant shapes: column, cone; materials: bakelite, nickel
  - anchor: stepping-switch-bank
    apply: prompt
    iteration: 2
    problem: a field of glowing green blobs and bars; no recognisable stepping switches (subject, artefacts)
    prompt: >-
      Replace the previous object completely with a steel rack of automatic electromechanical stepping switches:
      several identical switches in a row, each with a wiper arm sweeping across a semicircular bank of brass
      contacts, coils and ratchets visible. Keep only the lighting, colour grade, camera angle and dark
      background. Dominant shapes: semicircles, arms, racks; materials: steel, brass
  - anchor: variable-tuning-capacitor
    apply: fresh
    iteration: 2
    problem: a shaft with plates in front of the previous green blob field, cropped (carryover, cropping)
    prompt: >-
      an air variable tuning capacitor: two sets of interleaved semicircular aluminium plates on a brass shaft,
      one set half rotated between the other, mounted in a small frame, whole object centered; dominant shapes:
      semicircular plates, shaft; materials: aluminium, brass
  - anchor: crystal-radio-set
    apply: fresh
    iteration: 2
    problem: (it 1 and 2) modern padded headphones; the crystal is a quartz point, not galena (plausibility)
    prompt: >-
      a 1920s crystal radio set on a small wooden board: a coil of enamelled copper wire wound on a cardboard
      tube, a small dark grey galena crystal in a brass cup touched by a fine cat's-whisker wire, and a single
      old black bakelite earpiece receiver on a cord beside the board; no modern headphones; dominant shapes:
      coil, board; materials: wood, copper wire, galena
    style:
      negative: [text, letters, labels, logo, watermark, brand names, people, hands, cluttered background,
                 cropped subject, modern headphones, padded ear cushions, quartz crystal]
  - anchor: tube-computer-wall
    apply: prompt
    iteration: 2
    problem: modern server racks with LEDs, not a 1940s vacuum-tube computer (plausibility)
    prompt: >-
      Replace the previous object completely with a 1940s room-sized vacuum tube computer: a long wall of tall
      grey steel cabinets with open fronts packed with rows of thousands of small glowing vacuum tubes, plugboard
      panels and thick cables looping between cabinets; no LEDs, no modern server racks. Keep only the lighting,
      colour grade, camera angle and dark background. Dominant shapes: wall, grid of bulbs, cables; materials:
      steel, glass, copper
