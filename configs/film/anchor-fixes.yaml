      tiny fibres and dust specks jumping up toward the rod; nothing attached to the ends of the rod, no spheres,
      no metal; dominant shapes: rod, fibres; materials: amber, fur
    style:
      negative: [text, letters, labels, logo, watermark, brand names, people, hands, cluttered background,
                 cropped subject, spheres, balls, metal end caps, knobs, handle]
