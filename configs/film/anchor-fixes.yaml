# Claude-drafted fixes for film anchors that fail the pass standard (configs/film/anchor-standard.yaml).
# Owner instruction 2026-11-24: Claude judges every anchor and iterates fixes until all pass.
# apply: fresh (independent text-to-image keyframe) | instruction (re-edit from the parent) | prompt (revised prompt)
# Optional: prompt (revised prompt), style (per-anchor style-pack overrides, merged into style_override).
# `film-storyboard` applies these; `render --anchors-only` re-renders changed anchors and their edit descendants.
version: 1
natural_scene: &natural
  description: >-
    Cinematic photograph of a natural electrical phenomenon in its real setting, photorealistic, crisp detail,
    no man-made objects, no pedestal, no stand, no frame, no studio props
  composition: phenomenon centered and filling the frame, wide view, nothing cropped
  materials: only natural elements such as cloud, rain, air, snow, water and light; copper and amber appear only
    as the colour of the light, never as objects
  lens: wide-angle landscape lens, deep focus
  negative: [text, letters, labels, logo, watermark, brand names, people, hands, cluttered background, cropped subject,
             pedestal, plinth, stand, display case, frame, anvil, man-made objects, aquarium, glass tank, pottery,
             vase, container, box, glass, metal object, copper object, cylinder, platform]
fixes:
  # --- iteration 0 (Spark batch-1 contact sheet): reference edits that kept the parent ------------------
  # --- iteration 1 (anchors-only pass 1, 18 anchors judged; 9 fail) ---------------------------------------
  - anchor: storm-cell-over-plain
    apply: prompt
    iteration: 1
    problem: the cloud sits on a copper and glass pedestal like a museum piece (plausibility, single subject)
    prompt: >-
      a towering flat-topped cumulonimbus thunderstorm cloud spreading out high above an empty dark grassy plain
      at night, lit from within by flickering lightning, grey rain curtains falling onto the bare ground; nothing
      on the ground; dominant shapes: broad flat cloud top, wide column of rain; materials: water vapour, ice
    style: *natural
  - anchor: forked-lightning-bolt
    apply: fresh
    iteration: 1
    problem: a copper fork-shaped object on a ceramic stand sits in front of the lightning (single subject)
    prompt: >-
      a single bright forked lightning bolt splitting into many thin branching channels from the clouds down to
      the bare open ground of an empty plain against a black night sky, nothing at the strike point; dominant shapes: branching line, fork; materials:
      plasma, air
    style: *natural
