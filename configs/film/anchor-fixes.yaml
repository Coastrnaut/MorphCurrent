# Claude-drafted fixes for film anchors that fail the pass standard (configs/film/anchor-standard.yaml).
# Owner instruction 2026-11-24: Claude judges every anchor and iterates fixes until all pass.
# apply: fresh (independent text-to-image keyframe) | instruction (re-edit from the parent) | prompt (revised prompt)
# Optional: prompt (revised prompt), style (per-anchor style-pack overrides, merged into style_override).
# `film-storyboard` applies these; `render --anchors-only` re-renders changed anchors and their edit descendants.
version: 1
natural_scene: &natural
  description: >-
    Cinematic photograph of a natural electrical phenomenon in its real setting, photorealistic, crisp detail,
    no man-made objects, no pedestal, no stand, no frame, no studio props
  composition: phenomenon centered and filling the frame, wide view, nothing cropped
fixes:
  # --- iteration 0 (Spark batch-1 contact sheet): reference edits that kept the parent ------------------
  # --- iteration 1 (anchors-only pass 1, 18 anchors judged; 9 fail) ---------------------------------------
  - anchor: storm-cell-over-plain
    apply: prompt
    iteration: 1
    problem: the cloud sits on a copper and glass pedestal like a museum piece (plausibility, single subject)
    prompt: >-
      towering anvil-topped cumulonimbus thunderstorm cell floating high above a dark flat plain at night, lit
      from within by flickering lightning, grey rain curtains falling to the ground below; dominant shapes:
      anvil, column; materials: water vapour, ice
    style: *natural
  - anchor: forked-lightning-bolt
    apply: fresh
    iteration: 1
    problem: a copper fork-shaped object on a ceramic stand sits in front of the lightning (single subject)
    prompt: >-
      a single bright forked lightning bolt splitting into many thin branching channels from the top of the
      frame down to the horizon against a black night sky; dominant shapes: branching line, fork; materials:
      plasma, air
    style: *natural
  - anchor: rubbed-amber-and-fur
    apply: fresh
    iteration: 0
    problem: (iteration 0) parent spheres remained; iteration 1 passes
  - anchor: mast-tip-corona
    apply: fresh
    iteration: 1
    problem: glass tubes and fittings left over from the amber rod clutter the mast (carryover)
    prompt: >-
      the top of a tall wooden ship's mast at night in a storm, its pointed tip crowned by a pale blue-violet
      corona glow with fine discharge streamers; dominant shapes: spike, halo; materials: wood, ionized air
    style: *natural
  - anchor: aurora-curtain
    apply: fresh
    iteration: 1
    problem: the aurora is shown inside a copper frame with a copper cup in the snow (single subject)
    prompt: >-
      rippling green and violet aurora curtains folding across a polar night sky above a snowy plain, wide
      landscape view; dominant shapes: curtain, ribbon; materials: ionized gas
    style: *natural
  - anchor: electric-eel-silhouette
    apply: fresh
    iteration: 1
    problem: the eel is inside a glowing copper frame left over from the aurora (carryover)
    prompt: >-
      a long dark eel-like electric fish swimming through dark murky water, faint stacked electrocyte bands
      glowing softly along its whole body, side view; dominant shapes: elongated body, stacked bands;
      materials: water, living tissue
    style:
      description: >-
        Cinematic underwater photograph of a living animal in dark water, photorealistic, crisp detail,
        no man-made objects, no frame, no aquarium glass
      composition: whole animal in frame, centered, side view, nothing cropped
  - anchor: charged-dust-cloud
    apply: fresh
    iteration: 1
    problem: the dust streams out of a copper and glass nozzle (single subject)
    prompt: >-
      glittering dust motes drifting and clustering along curved invisible field lines inside a diagonal
      sunbeam crossing a dark room; dominant shapes: points, field lines; materials: dust, light
    style: *natural
  - anchor: crown-of-cups
    apply: fresh
    iteration: 1
    problem: a single cup under a wire cage, not a ring of cups bridged by metal strips (subject)
    prompt: >-
      crown of cups battery: a ring of eight small glass cups filled with brine standing in a circle, each cup
      bridged to the next by an arched strip of zinc joined to copper; dominant shapes: ring, arches;
      materials: glass, zinc, copper, brine
  - anchor: rolled-paper-capacitor
    apply: fresh
    iteration: 1
    problem: shows the accumulator's glass box with rolls inside instead of one rolled capacitor (carryover, subject)
    prompt: >-
      a single rolled foil and paper capacitor: two long strips of metal foil and waxed paper rolled tightly
      into a cylinder, partly unrolled to show the spiral layers, two thin wire leads at the ends; dominant
      shapes: spiral, cylinder; materials: aluminium foil, waxed paper
  - anchor: glass-plate-condenser-stack
    apply: fresh
    iteration: 1
    problem: repeats the glass box with rolls instead of a stack of glass plates with foil (carryover, subject)
    prompt: >-
      a block of square glass plates interleaved with thin foil sheets, stacked and clamped in a simple wooden
      frame with brass screws; dominant shapes: stacked plates, block; materials: glass, foil, wood
