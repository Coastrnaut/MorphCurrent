schema_version: 1
name: organic-machines

render:
  width: 832
  height: 480
  generation_fps: 16
  delivery_fps: 24
  anchor_profile: flux_reference_edit
  bridge_profile: wan22_flf2v_quality
  master_seed: 123456
  max_bridge_frames: 81

style:
  description: >
    Surreal cinematic macro photography; iridescent blue and silver
    materials, dark backgrounds, volumetric side-lighting.
  composition: centered_subject
  camera: continuous_slow_push
  palette: [blue, violet, silver]

audio:
  # This BPM is a manual planning grid; no copyrighted audio file is bundled.
  bpm: 120
  synchronization: downbeat
  beat_offset_seconds: 0

anchors:
  - id: orchid
    prompt: >
      A luminous glass orchid with translucent blue petals, centered
      and framed as a cinematic macro photograph.
    seed: 101
    generation: text_to_image

  - id: butterfly
    prompt: >
      A metallic butterfly with translucent wing panels resembling
      the previous orchid's petals, same center and lighting.
    seed: 102
    generation: reference_edit
    reference: orchid

  - id: phoenix
    prompt: >
      Transform the butterfly into a silver mechanical phoenix seen
      straight from the front, perfectly centered and symmetrical, wings
      spread wide in the same position, span and scale as the butterfly's
      wings, head where the butterfly's head is, long tail feathers hanging
      straight down; keep the same framing, dark background, palette and
      lighting direction.
    negative_prompt: >
      side view, profile, three-quarter view, walking, standing on legs,
      off-center, small subject, cropped wings, text, watermark
    seed: 103
    generation: reference_edit
    reference: butterfly

transitions:
  - from: orchid
    to: butterfly
    duration_beats: 8
    seed: 201
    candidates: 3
    motion: slow_push
    mode: direct
    prompt: >
      Continuous physical metamorphosis in one uninterrupted shot:
      glass petals lift into articulated wings; petal veins become
      luminous circuitry; camera pushes forward. No cuts or dissolves.

  - from: butterfly
    to: phoenix
    duration_beats: 8
    seed: 202
    candidates: 3
    motion: static
    mode: direct
    prompt: >
      Continuous physical metamorphosis in one fixed, front-facing shot:
      the butterfly's glass wings widen and grow silver feathers that
      assemble from the wing lattice, its body lengthens into the
      phoenix's chest, head and hanging tail feathers. The subject stays
      centered and the same size the whole time; static camera, stable
      lighting, no zoom, no turning, no cuts or dissolves.
