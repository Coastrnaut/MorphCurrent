# Do not install models into MorphCurrent controller .venv; use ComfyUI Portable's
# python_embeded or manual ComfyUI's dedicated .venv.
# Paths are discovered on Windows; no WSL, Docker Linux or GPU passthrough.
models:
  anchor:
    preferred_families: [flux, qwen_image]
    checkpoint_path: null
    sha256: null
    license_verified: false
    precision: null
  bridge:
    family: wan_2_2_i2v_a14b_flf2v
    # Expected ComfyUI Portable I2V model filenames; null means NOT YET locally verified.
    # Diffusion models directory: C:\AI\ComfyUI_windows_portable\ComfyUI\models\diffusion_models\
    # high: wan2.2_i2v_high_noise_14B_fp8_scaled.safetensors
    # low:  wan2.2_i2v_low_noise_14B_fp8_scaled.safetensors
    # text encoder under models\text_encoders: umt5_xxl_fp8_e4m3fn_scaled.safetensors
    # VAE under models\vae: wan_2.1_vae.safetensors
    high_noise_checkpoint: null
    low_noise_checkpoint: null
    high_noise_sha256: null
    low_noise_sha256: null
    license_verified: false
    precision: unmeasured
    loading_policy: unmeasured
    note: "2x14B FP16 weights cannot both be fully resident on RTX A6000 48 GiB"
